<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ESP32-S3 无线设备电量显示项目概览</title>
  <desc id="desc">Windows 采集端通过 USB 或 Wi-Fi 将两台设备的电量发送到 ESP32-S3，ESP32-S3 在 240×320 LVGL 屏幕上显示设备状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d171d"/>
      <stop offset="1" stop-color="#17242b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21323b"/>
      <stop offset="1" stop-color="#18262d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#42d6b5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64b5f6"/>
    </marker>
    <style>
      .sans { font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #f2f5f4; }
      .subtitle { font-size: 15px; fill: #91a3a5; }
      .section { font-size: 20px; font-weight: 700; fill: #f2f5f4; }
      .label { font-size: 16px; fill: #f2f5f4; }
      .small { font-size: 13px; fill: #b9c7c8; }
      .tiny { font-size: 12px; fill: #91a3a5; }
      .teal { fill: #42d6b5; }
      .blue { fill: #64b5f6; }
      .yellow { fill: #f2c14e; }
      .danger { fill: #e76f51; }
      .muted { fill: #91a3a5; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="68" class="sans title">ESP32-S3 无线设备电量显示</text>
  <text x="70" y="98" class="sans subtitle">当前实现：Windows 采集两台设备 → USB / Wi-Fi 传输 → ESP32-S3 → LVGL 屏幕</text>

  <rect x="70" y="145" width="350" height="500" rx="14" fill="url(#panel)" stroke="#30454f" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="190" class="sans section">Windows 采集端</text>
  <text x="100" y="218" class="sans small">BatteryBridge.ps1</text>

  <rect x="100" y="255" width="290" height="88" rx="10" fill="#172229" stroke="#3c5e68"/>
  <circle cx="130" cy="285" r="13" fill="#42d6b5"/>
  <path d="M123 285h14M130 278v14" stroke="#0d171d" stroke-width="3"/>
  <text x="160" y="283" class="sans label">HyperX Cloud III S</text>
  <text x="160" y="309" class="sans small">HID 查询：电量 / 充电状态</text>

  <rect x="100" y="365" width="290" height="88" rx="10" fill="#172229" stroke="#3c5e68"/>
  <circle cx="130" cy="395" r="13" fill="#64b5f6"/>
  <rect x="122" y="387" width="16" height="16" rx="4" fill="none" stroke="#0d171d" stroke-width="3"/>
  <text x="160" y="393" class="sans label">罗技 PRO Wireless</text>
  <text x="160" y="419" class="sans small">G HUB 接口：电量 / 连接状态</text>

  <rect x="100" y="490" width="290" height="116" rx="10" fill="#122027" stroke="#2e4a54"/>
  <text x="122" y="520" class="sans label">输出帧</text>
  <text x="122" y="549" class="sans small">BAT2,device,level,connected,charging</text>
  <text x="122" y="575" class="sans tiny">USB 模式可等待匹配的 ACK BAT2</text>

  <rect x="495" y="185" width="325" height="155" rx="14" fill="#172a2d" stroke="#42d6b5" stroke-width="2"/>
  <text x="530" y="228" class="sans section teal">USB 串口</text>
  <text x="530" y="258" class="sans label">115200 · BAT2 · ACK</text>
  <text x="530" y="291" class="sans small">适合首次配置、诊断和严格收包确认</text>
  <path d="M420 300 C450 300 458 260 490 260" fill="none" stroke="#42d6b5" stroke-width="4" marker-end="url(#arrowTeal)"/>

  <rect x="495" y="405" width="325" height="155" rx="14" fill="#182839" stroke="#64b5f6" stroke-width="2"/>
  <text x="530" y="448" class="sans section blue">Wi-Fi HTTP</text>
  <text x="530" y="478" class="sans label">POST /battery</text>
  <text x="530" y="507" class="sans small">可选 X-Battery-Token · mDNS</text>
  <text x="530" y="534" class="sans tiny">GET /health 查看 Wi-Fi、IP 和数据年龄</text>
  <path d="M420 460 C455 460 462 480 490 480" fill="none" stroke="#64b5f6" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="895" y="145" width="435" height="500" rx="14" fill="url(#panel)" stroke="#30454f" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="190" class="sans section">ESP32-S3 固件</text>
  <text x="930" y="218" class="sans small">BatteryTransport + LVGL Dashboard</text>
  <path d="M820 260 C850 260 855 260 890 260" fill="none" stroke="#42d6b5" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <path d="M820 480 C850 480 855 480 890 480" fill="none" stroke="#64b5f6" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="930" y="255" width="365" height="102" rx="10" fill="#172229" stroke="#3c5e68"/>
  <text x="956" y="286" class="sans label">网络与存储</text>
  <text x="956" y="314" class="sans small">Wi-Fi 自动重连 · NVS 持久化 · battery-panel.local</text>
  <text x="956" y="338" class="sans tiny">断线后设备数据超过 45 秒显示过期</text>

  <rect x="930" y="385" width="365" height="102" rx="10" fill="#172229" stroke="#3c5e68"/>
  <text x="956" y="416" class="sans label">数据处理</text>
  <text x="956" y="444" class="sans small">校验 BAT1 / BAT2 · 分设备状态 · 更新时间</text>
  <text x="956" y="468" class="sans tiny">未知电量显示 --，不会伪报为 0%</text>

  <rect x="930" y="515" width="365" height="102" rx="10" fill="#172229" stroke="#3c5e68"/>
  <text x="956" y="546" class="sans label">当前实机边界</text>
  <text x="956" y="574" class="sans small">离线构建与脚本检查已通过</text>
  <text x="956" y="598" class="sans tiny yellow">尚未连接 ESP32-S3：屏幕 / Wi-Fi / ACK 待实测</text>

  <rect x="70" y="700" width="1260" height="145" rx="14" fill="#101c22" stroke="#30454f" stroke-width="2"/>
  <text x="100" y="740" class="sans section">屏幕当前布局（240 × 320）</text>
  <rect x="100" y="760" width="160" height="64" rx="6" fill="#10171c" stroke="#4b6269"/>
  <text x="112" y="782" class="sans small">设备电量</text>
  <text x="176" y="782" class="sans tiny teal">Wi-Fi 未连接</text>
  <rect x="112" y="791" width="136" height="22" rx="4" fill="#1b252c"/>
  <text x="119" y="806" class="sans tiny">HyperX       --</text>
  <text x="119" y="818" class="sans tiny">罗技          --</text>

  <text x="305" y="781" class="sans label">顶部状态</text>
  <text x="305" y="809" class="sans small">Wi-Fi 未连接 / Wi-Fi 已连接</text>
  <text x="565" y="781" class="sans label">设备卡片</text>
  <text x="565" y="809" class="sans small">电量条、充电状态、最近更新时间</text>
  <text x="835" y="781" class="sans label">底部状态</text>
  <text x="835" y="809" class="sans small">数据来源 USB / Wi-Fi · 网络状态</text>
  <text x="1120" y="781" class="sans label">颜色</text>
  <circle cx="1128" cy="808" r="6" fill="#42d6b5"/><text x="1142" y="813" class="sans tiny">正常</text>
  <circle cx="1192" cy="808" r="6" fill="#f2c14e"/><text x="1206" y="813" class="sans tiny">警示</text>
  <circle cx="1252" cy="808" r="6" fill="#e76f51"/><text x="1266" y="813" class="sans tiny">过期</text>
</svg>
